        <path d="M-150 8 C-185 -54 -78 -72 -112 -138 M-15 10 C-60 -52 44 -80 8 -142 M118 6 C80 -52 178 -76 140 -138" fill="none" stroke="#dce8f2" stroke-width="18" stroke-linecap="round" opacity=".78"/>
